<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Contract Hub | Review Studio</title><style>
:root{--navy:#102f38;--teal:#176e65;--gold:#c3a36b;--paper:#f5f6f2;--muted:#70817f;--line:#dce3de}*{box-sizing:border-box}body{margin:0;font:15px/1.6 Arial,sans-serif;color:var(--navy);background:var(--paper)}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button{border:0;background:none;color:inherit}aside{position:fixed;inset-block:0;inset-inline-start:0;width:244px;background:var(--navy);color:#fff;padding:32px 24px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:700;display:flex;align-items:center;gap:12px;line-height:1.2}.mark{border:1px solid var(--gold);color:var(--gold);padding:8px;font-family:Georgia;font-size:25px;border-radius:12px}.brand small{font-size:10px;letter-spacing:2px;color:#acc1be}.navlabel{color:#8ca6a2;font-size:10px;letter-spacing:2px;margin:48px 12px 15px}nav button{width:100%;text-align:start;padding:13px 15px;border-radius:8px;margin-bottom:5px;color:#bfd0cd}nav button.active{background:#28505a;color:#fff}nav button span{margin-inline-end:12px}.sidefoot{margin-top:auto;color:#a9bfbb;font-size:12px;border-top:1px solid #35525a;padding-top:23px}.avatar{background:#45646b;padding:9px;border-radius:50%;margin-inline-end:10px;color:white}main{margin-inline-start:244px}header{height:83px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}header small{color:var(--muted)}.pill{font-size:11px;background:#f5eedf;color:#80683c;border:1px solid #e4d8bd;padding:5px 10px;border-radius:30px}.language{border:1px solid var(--line);border-radius:8px;padding:7px 14px;margin-inline-start:16px}.page{max-width:1230px;margin:auto;padding:42px 48px}h1{font-size:37px;line-height:1.2;letter-spacing:-1px;font-weight:500;margin:10px 0 14px}h2{font-size:22px;font-weight:500;margin:0 0 20px}h3{font-size:17px;margin:0 0 7px}p{margin:6px 0 18px}.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--teal);font-weight:bold}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;gap:20px}.primary{background:var(--teal);color:white;border-radius:7px;padding:12px 21px;font-weight:bold}.secondary{border:1px solid var(--line);background:white;border-radius:7px;padding:10px 18px}.hero{background:var(--navy);color:white;border-radius:15px;padding:36px;display:grid;grid-template-columns:1fr 180px;gap:25px;margin-bottom:28px;position:relative;overflow:hidden}.hero h2{font-family:Georgia,serif;font-size:31px;margin-bottom:12px}.hero p{color:#b9d0cb;max-width:550px}.hero .primary{background:#e9e1cf;color:var(--navy)}.heroart{border:1px solid #607b7d;transform:rotate(8deg);border-radius:9px;padding:24px;height:180px}.heroart b{font:45px Georgia;color:var(--gold)}.heroart i{height:4px;background:#587475;display:block;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:35px}.stat{padding:23px;background:#fff;border:1px solid var(--line);border-radius:11px}.stat strong{font:32px Georgia;display:block;margin-top:8px}.table{width:100%;border-collapse:collapse;text-align:start;background:#fff;border:1px solid var(--line)}th,td{text-align:start;padding:18px 20px;border-bottom:1px solid var(--line)}th{font-size:10px;letter-spacing:1px;color:var(--muted);background:#eff2ed}.tag{display:inline-block;border-radius:5px;padding:3px 9px;background:#e5eee7;font-size:11px;color:#2e6d50}.risk{color:#a55343;background:#faeae4}.medium{color:#92713b;background:#f7f0dc}.link{color:var(--teal);font-weight:bold}.panel{background:#fff;border:1px solid var(--line);padding:30px;border-radius:12px}.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:25px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:25px}.tabs button{padding:10px 2px}.tabs .on{border-bottom:2px solid var(--teal);font-weight:bold}.drop{border:1.5px dashed #a1bab2;border-radius:10px;text-align:center;padding:42px 25px;background:#f7faf7}.drop.drag{background:#e2eee5}.uploadicon{font-size:37px;color:var(--teal)}textarea{width:100%;height:230px;border:1px solid var(--line);border-radius:8px;padding:15px;resize:vertical}label{display:block;font-weight:bold;margin:15px 0 8px}.select{width:100%;padding:11px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--navy)}.notice{padding:14px 18px;background:#f0f3ee;border-radius:7px;font-size:12px;color:#596f67;margin-top:20px}.steps{list-style:none;padding:0}.steps li{padding:19px 0;border-bottom:1px solid var(--line);display:flex;gap:18px}.stepnum{border:1px solid var(--line);border-radius:50%;width:28px;height:28px;display:inline-grid;place-items:center;flex-shrink:0}.done{background:var(--teal);color:#fff}.progress{height:7px;background:#e3e9e2;border-radius:5px;overflow:hidden;margin:25px 0}.progress div{height:100%;background:var(--teal);transition:width .4s}.processing{max-width:730px;margin:30px auto}.finding{border-top:1px solid var(--line);padding:25px 0}.finding:first-child{border-top:0}.finding summary{cursor:pointer;list-style:none;display:flex;gap:14px;align-items:center}.finding summary strong{flex:1;font-size:18px}.finding .content{padding-top:22px}.field{margin-top:18px;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:bold}blockquote{border-inline-start:3px solid var(--gold);background:#f7f6f0;margin:10px 0;padding:15px 20px}.proposed{background:#edf4ef;padding:17px;border-radius:6px}.filter{display:flex;gap:8px;margin:25px 0}.filter .on{background:var(--navy);color:#fff}.empty{text-align:center;padding:45px}.foot{font-size:11px;color:var(--muted);margin-top:35px}.toast{position:fixed;bottom:25px;inset-inline-end:25px;background:var(--navy);color:white;padding:14px 25px;border-radius:8px;z-index:4}a{color:var(--teal)}@media(max-width:1000px){aside{width:200px}main{margin-inline-start:200px}.page{padding:28px}.grid{grid-template-columns:1fr}.heroart{display:none}.hero{grid-template-columns:1fr}header{padding:0 28px}.stats{gap:10px}th,td{padding:12px}}@media(max-width:650px){aside{position:static;width:100%;padding:16px}.brand{font-size:17px}.navlabel,.sidefoot{display:none}nav{display:flex;margin-top:15px}nav button{padding:8px;font-size:12px}nav button span{display:none}main{margin:0}header{height:65px;padding:0 18px}.page{padding:24px 18px}h1{font-size:29px}.top{align-items:flex-start;flex-direction:column}.hero{padding:25px}.stats{grid-template-columns:1fr 1fr 1fr}.stat{padding:12px;font-size:11px}.stat strong{font-size:25px}.tablewrap{overflow:auto}.panel{padding:20px}.pill{font-size:9px}.language{margin-inline-start:5px;padding:5px 8px}}
</style></head><body><aside><div class="brand"><div class="mark">AI</div><div>Contract Hub<br><small>REVIEW STUDIO</small></div></div><div class="navlabel">WORKSPACE</div><nav id="nav"></nav><div class="sidefoot"><p><span class="avatar">FE</span>Group (2)</p>CAI5_IND6_G1<br>DEPI Capstone Project</div></aside><main><header><div id="crumb"></div><div><span class="pill" id="badge"></span><button class="language" onclick="toggle()" id="lang"></button></div></header><section class="page" id="app"></section></main><script>
let ar=false,page='home',tab='file',fileName='',filter='all',timer,step=0;const $=s=>document.querySelector(s),T=(en,arabic)=>ar?arabic:en;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findings=[{risk:'high',title:['Uncapped liability','غياب الحد الأقصى للمسؤولية'],ref:['Clause 8.2 • Rule 06: Limitation of liability','البند 8.2، القاعدة 06: تحديد المسؤولية'],quote:'The Provider shall be liable for all losses arising from the Services.',translation:'يتحمل مقدم الخدمة المسؤولية عن جميع الخسائر الناشئة عن الخدمات.',issue:['The supplied clause sets no financial cap and does not distinguish between direct and indirect losses. This may create disproportionate exposure for the provider.','لا يحدد البند سقفًا ماليًا للمسؤولية ولا يميز بين الخسائر المباشرة وغير المباشرة، مما قد يعرض مقدم الخدمة لالتزامات غير متناسبة.'],recommend:['Negotiate an aggregate cap, clarify excluded losses and assess appropriate exceptions with legal counsel.','التفاوض على سقف إجمالي للمسؤولية، وتحديد الخسائر المستثناة ومراجعة الاستثناءات المناسبة مع المستشار القانوني.'],wording:['Subject to [agreed exceptions], the Provider’s aggregate liability under this Agreement shall not exceed [agreed liability cap].','مع مراعاة [الاستثناءات المتفق عليها]، لا يتجاوز إجمالي مسؤولية مقدم الخدمة بموجب هذا العقد [الحد الأقصى المتفق عليه للمسؤولية].']},{risk:'medium',title:['Unclear payment deadline','عدم تحديد موعد السداد'],ref:['Clause 4.1 • Rule 03: Payment','البند 4.1، القاعدة 03: السداد'],quote:'The Customer shall pay all invoices promptly.',translation:'يسدد العميل جميع الفواتير على وجه السرعة.',issue:['“Promptly” provides no measurable deadline. The parties may disagree on when payment becomes overdue.','لا تتضمن عبارة «على وجه السرعة» موعدًا قابلًا للقياس، وقد يختلف الطرفان بشأن تاريخ استحقاق السداد.'],recommend:['Specify a payment period and a process for disputed invoices.','تحديد مدة للسداد وإجراء واضح للاعتراض على الفواتير.'],wording:['The Customer shall pay each undisputed invoice within [number of days] days of receipt.','يسدد العميل كل فاتورة غير متنازع عليها خلال [عدد الأيام] يومًا من تاريخ استلامها.']},{risk:'low',title:['Undefined notice address','عدم تحديد عنوان الإخطارات'],ref:['Clause 12 • Additional observation: Notices','البند 12، ملاحظة إضافية: الإخطارات'],quote:'Notices shall be sent to the designated email address.',translation:'تُرسل الإخطارات إلى عنوان البريد الإلكتروني المحدد.',issue:['The example does not identify the designated email address. Verify the schedules before treating this as an omission.','لا يحدد المثال عنوان البريد الإلكتروني المقصود. يجب مراجعة الملحقات قبل اعتباره بيانًا مفقودًا.'],recommend:['Identify the notice contacts and the process for updating them.','تحديد جهات الاتصال المعنية بالإخطارات وآلية تحديث بياناتها.'],wording:['Notices shall be sent to [notice email address]. Each party shall notify the other of any change to its contact details.','تُرسل الإخطارات إلى [البريد الإلكتروني للإخطارات]، ويلتزم كل طرف بإخطار الآخر بأي تغيير في بيانات الاتصال الخاصة به.']}];
function nav(){ $('#nav').innerHTML=[['home','◫',T('Overview','نظرة عامة')],['new','＋',T('New review','مراجعة جديدة')],['reviews','▤',T('Review library','سجل المراجعات')]].map(([p,i,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${l}</button>`).join('');$('#badge').textContent=T('INTERACTIVE PROTOTYPE','نموذج تفاعلي تجريبي');$('#lang').textContent=ar?'English':'العربية';$('#crumb').innerHTML=T('Workspace <small> / Contract review</small>','مساحة العمل <small> / مراجعة العقود</small>');document.documentElement.lang=ar?'ar':'en';document.documentElement.dir=ar?'rtl':'ltr';}
function go(p){clearInterval(timer);page=p;render();window.scrollTo(0,0)}function toggle(){ar=!ar;render()}
function table(){return `<div class="tablewrap"><table class="table"><thead><tr><th>${T('DOCUMENT','المستند')}</th><th>${T('STATUS','الحالة')}</th><th>${T('RISK','المخاطر')}</th><th></th></tr></thead><tbody><tr><td><strong>${T('Service Agreement','عقد خدمات')}</strong><br><small class="muted">${T('Illustrative sample • 3 findings','مثال توضيحي، 3 ملاحظات')}</small></td><td><span class="tag">${T('Review ready','المراجعة جاهزة')}</span></td><td><span class="tag risk">${T('HIGH','مرتفع')}</span></td><td><button class="link" onclick="go('results')">${T('Open review ↗','عرض المراجعة ↗')}</button></td></tr></tbody></table></div>`}
function render(){nav();let h='';if(page==='home'){h=`<div class="top"><div><div class="eyebrow">AI CONTRACT HUB</div><h1>${T('Clarity before you sign.','وضوح أكبر قبل التوقيع.')}</h1><p class="muted">${T('Your workspace for a structured first review of service agreements.','مساحتك لإجراء مراجعة أولية منظمة لعقود الخدمات.')}</p></div><button class="primary" onclick="go('new')">＋ ${T('New review','مراجعة جديدة')}</button></div><div class="hero"><div><h2>${T('Focus on the clauses that matter.','ركّز على البنود التي تستحق انتباهك.')}</h2><p>${T('Explore contractual risks, trace findings to the source, and prepare practical amendments in your preferred language.','استكشف المخاطر التعاقدية، وراجع أدلتها من النص، واطّلع على التعديلات المقترحة بلغتك المفضلة.')}</p><button class="primary" onclick="go('results')">${T('Explore a sample review','استكشف مراجعة نموذجية')} ↗</button></div><div class="heroart" aria-hidden="true"><b>§</b><i></i><i></i><i style="width:60%"></i></div></div><div class="stats"><div class="stat">${T('Review checklist','قائمة المراجعة')}<strong>12 <small style="font:13px Arial">${T('rules','قاعدة')}</small></strong></div><div class="stat">${T('Supported inputs','صيغ الإدخال')}<strong style="font-size:22px">PDF · DOCX · ${T('Text','نص')}</strong></div><div class="stat">${T('Response languages','لغات المراجعة')}<strong style="font-size:22px">${T('Arabic & English','العربية والإنجليزية')}</strong></div></div><div class="top" style="margin-bottom:15px"><h2>${T('Sample workspace','مساحة عمل نموذجية')}</h2><span class="muted">${T('Demonstration data','بيانات توضيحية')}</span></div>${table()}`}
if(page==='reviews')h=`<div class="top"><div><div class="eyebrow">${T('YOUR DOCUMENTS','المستندات')}</div><h1>${T('Review library','سجل المراجعات')}</h1><p class="muted">${T('Explore the sample report. No documents are stored in this prototype.','استعرض التقرير النموذجي. لا تُخزّن المستندات في هذا النموذج التجريبي.')}</p></div><button class="primary" onclick="go('new')">＋ ${T('New review','مراجعة جديدة')}</button></div>${table()}`;
if(page==='new')h=`<div class="top"><div><div class="eyebrow">${T('STEP 01 / SUBMISSION','الخطوة 01 / إرسال المستند')}</div><h1>${T('Start a contract review','ابدأ مراجعة العقد')}</h1><p class="muted">${T('Choose a document or paste a clause to preview the review journey.','اختر مستندًا أو الصق بندًا لتجربة رحلة المراجعة.')}</p></div></div><div class="grid"><div class="panel"><div class="tabs"><button class="${tab==='file'?'on':''}" onclick="tab='file';render()">${T('Upload a document','رفع مستند')}</button><button class="${tab==='text'?'on':''}" onclick="tab='text';render()">${T('Paste contract text','لصق نص العقد')}</button></div>${tab==='file'?`<div class="drop" id="drop"><div class="uploadicon">⇧</div><h3>${fileName?esc(fileName):T('Drop your agreement here','اسحب العقد هنا')}</h3><p class="muted">PDF / DOCX · ${T('Up to 10 MB for this demo','حتى 10 ميجابايت في هذه التجربة')}</p><button class="secondary" onclick="$('#file').click()">${T('Browse files','اختر ملفًا')}</button><input id="file" type="file" accept=".pdf,.docx" hidden onchange="selectFile(this.files[0])"></div>`:`<textarea id="contract" aria-label="Contract text" placeholder="${T('Paste your service agreement or contractual clause here…','الصق عقد الخدمات أو البند التعاقدي هنا…')}"></textarea>`}<label>${T('Review perspective','منظور المراجعة')}</label><select class="select"><option>${T('Neutral, both parties','محايد، الطرفان')}</option><option>${T('Service provider','مقدم الخدمة')}</option><option>${T('Customer','العميل')}</option></select><div class="notice">${T('Prototype mode: files stay on your device. The next screen displays a predefined sample, not an analysis of your document.','وضع تجريبي: تظل الملفات على جهازك. تعرض الشاشة التالية مثالًا مُعدًا مسبقًا، وليس تحليلًا لمستندك.')}</div><button class="primary" style="margin-top:22px;width:100%" onclick="start(false)">${T('Preview review journey','تجربة رحلة المراجعة')}</button><button class="link" style="margin-top:15px;width:100%" onclick="start(true)">${T('Use sample agreement instead','استخدم العقد النموذجي')}</button></div><div class="panel"><h2>${T('What your review includes','ماذا تتضمن المراجعة؟')}</h2><ul class="steps">${[T('Risk levels with practical explanations','تصنيف المخاطر وشرح آثارها العملية'),T('Original quotations with translations','اقتباسات أصلية مع ترجمتها'),T('Clause and checklist references','مراجع البنود وقائمة المراجعة'),T('Suggested contractual wording','صياغات تعاقدية مقترحة')].map((t,i)=>`<li><span class="stepnum">${i+1}</span>${t}</li>`).join('')}</ul><p class="muted">${T('Your selected interface language also controls the sample review language.','تحدد لغة الواجهة لغة المراجعة النموذجية أيضًا.')}</p></div></div>`;
if(page==='processing'){const stages=[T('Document received','استلام المستند'),T('Preparing contract text','تجهيز نص العقد'),T('Checking contractual risks','فحص المخاطر التعاقدية'),T('Organizing the review','تنظيم المراجعة')];h=`<div class="processing panel"><div class="eyebrow">${T('STEP 02 / SIMULATED PROCESSING','الخطوة 02 / محاكاة المعالجة')}</div><h1>${T('Preparing your review','جارٍ تجهيز المراجعة')}</h1><p class="muted">${T('This preview demonstrates the processing experience.','يوضح هذا النموذج تجربة المعالجة.')}</p><div class="progress"><div style="width:${(step+1)*25}%"></div></div><ul class="steps">${stages.map((t,i)=>`<li><span class="stepnum ${i<=step?'done':''}">${i<step?'✓':i+1}</span>${t}</li>`).join('')}</ul><button class="secondary" onclick="go('new')">${T('Cancel preview','إلغاء التجربة')}</button></div>`}
if(page==='results')h=`<div class="top"><div><div class="eyebrow">${T('STEP 03 / INITIAL REVIEW','الخطوة 03 / المراجعة الأولية')}</div><h1>${T('Service Agreement','عقد خدمات')}</h1><p class="muted">${T('Illustrative report • Neutral perspective • Human review required','تقرير توضيحي، منظور محايد، يتطلب مراجعة بشرية')}</p></div><button class="secondary" onclick="download()">↓ ${T('Export sample report','تنزيل التقرير النموذجي')}</button></div><div class="grid"><div class="panel"><span class="tag risk">${T('OVERALL RISK: HIGH','المخاطر الإجمالية: مرتفع')}</span><h2 style="margin-top:18px">${T('Three issues to address before signing','ثلاث مسائل تحتاج إلى معالجة قبل التوقيع')}</h2><p class="muted">${T('The sample clauses leave liability uncapped, payment timing uncertain and notice details unverified. Findings below illustrate the intended report structure.','تترك البنود النموذجية المسؤولية دون سقف، وموعد السداد غير محدد، وبيانات الإخطارات بحاجة إلى تحقق. توضح الملاحظات أدناه الشكل المقترح للتقرير.')}</p></div><div class="panel"><h3>${T('Review scope','نطاق المراجعة')}</h3><p>${T('Three fictional clauses only','ثلاثة بنود افتراضية فقط')}</p><p class="muted">${T('No conclusion on the completeness or legal compliance of an actual contract.','لا يتضمن المثال حكمًا على اكتمال عقد فعلي أو توافقه مع القانون.')}</p></div></div><div class="filter">${['all','high','medium','low'].map((f,i)=>`<button class="secondary ${filter===f?'on':''}" onclick="filter='${f}';render()">${[T('All findings (3)','كل الملاحظات (3)'),T('High (1)','مرتفع (1)'),T('Medium (1)','متوسط (1)'),T('Low (1)','منخفض (1)')][i]}</button>`).join('')}</div><div class="panel">${findings.map((f,i)=>filter!=='all'&&filter!==f.risk?'':`<details class="finding" ${i===0||filter!=='all'?'open':''}><summary><span class="tag ${f.risk==='high'?'risk':f.risk==='medium'?'medium':''}">${ar?{high:'مرتفع',medium:'متوسط',low:'منخفض'}[f.risk]:f.risk.toUpperCase()}</span><strong>${i+1}. ${f.title[ar?1:0]}</strong><span>＋</span></summary><div class="content"><p class="muted">${f.ref[ar?1:0]}</p><div class="field">${T('ORIGINAL CONTRACT EVIDENCE','الدليل من النص الأصلي')}</div><blockquote dir="ltr">“${f.quote}”</blockquote>${ar?`<div class="field">الترجمة العربية للتوضيح</div><p>${f.translation}</p>`:''}<div class="field">${T('ISSUE AND PRACTICAL IMPACT','المشكلة والأثر العملي')}</div><p>${f.issue[ar?1:0]}</p><div class="field">${T('RECOMMENDATION','التوصية')}</div><p>${f.recommend[ar?1:0]}</p><div class="field">${T('SUGGESTED WORDING','الصياغة المقترحة')}</div><div class="proposed">${f.wording[ar?1:0]}</div><button class="link" style="margin-top:12px" onclick="copyClause(${i})">${T('Copy proposed wording','نسخ الصياغة المقترحة')}</button></div></details>`).join('')}</div><div class="notice">${T('Illustrative content only. Actual AI findings require verification by a qualified lawyer.','محتوى توضيحي فقط. تتطلب نتائج المراجعة الفعلية التحقق بواسطة محامٍ مؤهل.')}</div>`;
$('#app').innerHTML=h+`<div class="foot">AI Contract Hub · CAI5_IND6_G1 · Group (2) &nbsp; <a href="https://docs.n8n.io/" target="_blank" rel="noopener">${T('Workflow documentation','توثيق منصة الأتمتة')}</a></div>`;
if($('#drop')){$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('drag')};$('#drop').ondragleave=()=>$('#drop').classList.remove('drag');$('#drop').ondrop=e=>{e.preventDefault();selectFile(e.dataTransfer.files[0])};}}
function selectFile(f){if(!f)return;if(!/\.(pdf|docx)$/i.test(f.name))return toast(T('Choose a PDF or DOCX file.','اختر ملف PDF أو DOCX.'));if(f.size>10*1024*1024)return toast(T('Please choose a file under 10 MB.','اختر ملفًا أقل من 10 ميجابايت.'));fileName=f.name;render()}
function start(sample){if(!sample&&((tab==='file'&&!fileName)||(tab==='text'&&!$('#contract').value.trim())))return toast(T('Choose a file, paste text, or use the sample.','اختر ملفًا أو الصق النص أو استخدم المثال.'));page='processing';step=0;render();timer=setInterval(()=>{step++;if(step>3){clearInterval(timer);page='results';filter='all'}render()},950)}
function toast(t){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),3000)}async function copyClause(i){try{await navigator.clipboard.writeText(findings[i].wording[ar?1:0]);toast(T('Suggested wording copied','تم نسخ الصياغة'))}catch{toast(T('Select and copy the wording manually.','حدد الصياغة وانسخها يدويًا.'))}}
function download(){const text='AI CONTRACT HUB\n'+T('ILLUSTRATIVE REPORT, NOT AN ACTUAL CONTRACT REVIEW','تقرير توضيحي، ليس مراجعة فعلية لعقد')+'\n\n'+findings.map(f=>[f.title[ar?1:0],f.ref[ar?1:0],f.quote,ar?f.translation:'',f.issue[ar?1:0],f.recommend[ar?1:0],f.wording[ar?1:0]].join('\n\n')).join('\n\n----------------\n\n');const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=ar?'AI_Contract_Hub_Sample_AR.txt':'AI_Contract_Hub_Sample_EN.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}render();
</script></body></html>
